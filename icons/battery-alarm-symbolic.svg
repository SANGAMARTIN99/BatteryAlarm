<?xml version="1.0" encoding="UTF-8"?>
<!--
  battery-alarm-symbolic.svg
  Panel icon for BatteryAlarm GNOME Shell Extension.
  GNOME symbolic icon style: single-color, 16x16 viewBox.
  SPDX-License-Identifier: CC0-1.0
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 16 16"
     width="16" height="16">

  <!-- Battery body -->
  <rect x="1" y="4" width="12" height="8" rx="1.5" ry="1.5"
        style="fill:currentColor;fill-opacity:0.3;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round"/>

  <!-- Battery terminal (positive nub) -->
  <rect x="13" y="6.5" width="1.5" height="3" rx="0.75" ry="0.75"
        style="fill:currentColor;fill-opacity:0.8"/>

  <!-- Battery fill (shows "charged" state) -->
  <rect x="2.5" y="5.5" width="8" height="5" rx="0.5" ry="0.5"
        style="fill:currentColor;fill-opacity:0.85"/>

  <!-- Bell / alarm icon overlaid (small, bottom-right of battery) -->
  <g transform="translate(7.5, 6.5) scale(0.38)">
    <!-- Bell shape -->
    <path d="M8,1 C5.24,1 3,3.24 3,6 L3,10 L1,12 L15,12 L13,10 L13,6 C13,3.24 10.76,1 8,1 Z"
          style="fill:currentColor"/>
    <!-- Bell clapper -->
    <circle cx="8" cy="13.5" r="1.5"
            style="fill:currentColor"/>
  </g>
</svg>
