name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libglib2.0-bin zip python3 gettext

      - name: Validate metadata.json
        run: |
          python3 -c "
          import json
          with open('metadata.json') as f:
              data = json.load(f)
          required_keys = ['name', 'description', 'uuid', 'shell-version']
          for key in required_keys:
              assert key in data, f'Missing required metadata key: {key}'
          assert len(data['shell-version']) > 0, 'shell-version list cannot be empty'
          print('✅ metadata.json is valid!')
          "

      - name: Validate JavaScript syntax
        run: |
          node --check extension.js
          node --check prefs.js
          echo "✅ JavaScript syntax validated!"

      - name: Compile and validate GSettings schemas
        run: |
          glib-compile-schemas --strict --dry-run schemas/
          echo "✅ GSettings schemas validated successfully!"

      - name: Package extension (make pack)
        run: |
          make pack

      - name: Verify package integrity
        run: |
          ZIP_FILE=$(ls dist/*.zip | head -n 1)
          echo "Checking package: $ZIP_FILE"
          unzip -l "$ZIP_FILE"
          unzip -t "$ZIP_FILE"
          if unzip -l "$ZIP_FILE" | grep -q "gschemas.compiled"; then
            echo "❌ Error: gschemas.compiled must not be shipped in the extension package!"
            exit 1
          fi
          echo "✅ Extension package verified successfully!"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: battery-alarm-extension-package
          path: dist/*.zip
